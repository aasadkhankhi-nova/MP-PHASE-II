# Render.com blueprint — "New +" -> "Blueprint" -> select this repo,
# and this web service configures itself.
services:
  - type: web
    name: mp-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # paste it yourself in the Render dashboard (Supabase URI)
      - key: GEMINI_API_KEY
        sync: false          # your Gemini key
      - key: CORS_ORIGINS
        value: https://aasadkhankhi-nova.github.io
